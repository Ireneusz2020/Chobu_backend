services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api-gateway-db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: api_gateway }
    ports: ["5433:5432"]

  identity-service-db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: identity_service }
    ports: ["5434:5432"]

  auth-service-db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: auth_service }
    ports: ["5435:5432"]

  booking-service-db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: booking_service }
    ports: ["5436:5432"]

  membership-service-db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: membership_service }
    ports: ["5437:5432"]

  payment-service-db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: payment_service }
    ports: ["5438:5432"]

  # Remaining service databases follow same pattern to keep each microservice isolated.
