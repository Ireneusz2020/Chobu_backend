apiVersion: apps/v1
kind: Deployment
metadata:
  name: chobu-backend
  namespace: chobu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chobu-backend
  template:
    metadata:
      labels:
        app: chobu-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/chobu-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: chobu-config
            - secretRef:
                name: chobu-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
